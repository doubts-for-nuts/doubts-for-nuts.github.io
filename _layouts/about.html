---
layout: base
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    <div class="picandtext">

      <div class="picandtext-pic">
        <img src="/assets/web/jf.jpeg">
      </div>

      <div class="picandtext-text">
        {{ content }}
      </div>
    </div>
  </div>
 
  
  <p><small>The website's motto "Even numbers have feelings" is a play on the song <i>Mathematics</i>, by the artist (formerly known as) Mos Def.</small></p>
  

</article>
